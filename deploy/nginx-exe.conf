# /etc/nginx/sites-available/missing-works  (exe.dev setup)
#
#   internet --HTTPS--> exe.dev proxy --> nginx :8000 --> node 127.0.0.1:3000
#
# exe.dev terminates TLS and APPENDS the real client address as the LAST
# X-Forwarded-For entry. nginx passes that header through unchanged (it must
# not append its own address), and the API (TRUST_PROXY=true, loopback peer)
# rate-limits on the rightmost entry. Anything left of it is client-supplied.
#
# Port 8000 must be reachable ONLY by the exe.dev proxy. If clients could reach
# it directly they could forge X-Forwarded-For and dodge the per-IP limit (the
# global limit still applies). Verify from outside that http://<vm-ip>:8000 fails.

server {
    listen 8000;
    listen [::]:8000;
    server_name _;

    # No access log: avoids persisting client IPs. Errors only.
    access_log off;
    # Suppress request-level error logs too: nginx errors can contain client IPs.
    error_log /dev/null;

    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    server_tokens off;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Pass the exe.dev header through unchanged (do NOT use $proxy_add_x_forwarded_for).
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    # Only curated public files are deployed here; application code and the database
    # remain outside this directory. Atomic symlink swaps publish each release.
    root /var/www/missing-works/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
